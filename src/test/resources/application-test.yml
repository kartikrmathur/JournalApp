spring:
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/journaldb_test}
      database: journaldb_test
      auto-index-creation: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME:test@example.com}
    password: ${SPRING_MAIL_PASSWORD:test-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  redis:
    host: localhost
    port: 6379

weather:
  api:
    key: ${WEATHER_API_KEY:test-key}

jwt:
  # Placeholder for tests only - not a credential, never used to sign real tokens.
  secret: ${JWT_SECRET:test-only-not-a-real-secret-0123456789}
