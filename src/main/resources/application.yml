jwt:
  # Set JWT_SECRET in the environment. 32+ chars (HS256 needs 256 bits).
  # No default on purpose: the app should refuse to start rather than sign with a known key.
  secret: ${JWT_SECRET}

weather:
  api:
    key: ${WEATHER_API_KEY}

spring:
  application:
    name: Journal App
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/journaldb}
      database: journaldb
      auto-index-creation: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  redis:
    host: localhost
    port: 6379
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
server:
  port: 8080

